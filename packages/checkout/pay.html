<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limen — Pago</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --page-bg:#F6EFE2;
    --surface:#FFFCF5;
    --amber:#BE7A42;
    --sage:#6E8768;
    --danger:#B0503F;
    --text:#3B2E22;
    --text-muted:#8C7A63;
    --line:#E6D9C0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--page-bg); min-height:100vh; font-family:'Inter', sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:380px; max-width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; box-shadow:0 30px 60px -20px rgba(59,46,34,0.25); padding:28px; text-align:center;
  }
  .brand{ font-family:'Source Serif 4', serif; font-weight:500; font-size:22px; margin-bottom:18px; }
  .brand span{ color:var(--amber); }
  .desc{ font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:20px; }
  .status{ font-size:13px; margin-top:14px; line-height:1.5; }
  .status.error{ color:var(--danger); }
  .status.ok{ color:var(--sage); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">Limen<span>.</span></div>
  <div class="desc">Abriendo el pago seguro con Paddle — tu tarjeta nunca pasa por nuestros servidores.</div>
  <div class="status" id="status">Cargando…</div>
</div>

<script type="module" src="pay.js"></script>
</body>
</html>
