<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limen — Pago</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&family=Inter:wght@400;500;600&display=swap');
  :root{
    --page-bg:#F6EFE2;
    --surface:#FFFCF5;
    --amber:#BE7A42;
    --text:#3B2E22;
    --text-muted:#8C7A63;
    --line:#E6D9C0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--page-bg); min-height:100vh; font-family:'Inter', sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:380px; max-width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; box-shadow:0 30px 60px -20px rgba(59,46,34,0.25); padding:28px; text-align:center;
  }
  .brand{ font-family:'Source Serif 4', serif; font-weight:500; font-size:22px; margin-bottom:18px; }
  .brand span{ color:var(--amber); }
  .desc{ font-size:13px; color:var(--text-muted); line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Limen<span>.</span></div>
  <div class="desc">Este sitio solo sirve enlaces de pago generados desde la extensión o el panel de administración — no está pensado para visitarse directamente. Si llegaste aquí por error, puedes cerrar esta pestaña.</div>
</div>
</body>
</html>
