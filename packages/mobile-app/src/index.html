<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Limen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --page-bg:#F6EFE2; --surface:#FFFCF5; --amber:#BE7A42; --sage:#6E8768;
    --danger:#B0503F; --text:#3B2E22; --text-muted:#8C7A63; --line:#E6D9C0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--page-bg); font-family:'Inter', sans-serif; color:var(--text);
    min-height:100vh; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  .brand{ font-family:'Source Serif 4', serif; font-size:24px; margin:24px 0 6px; }
  .brand span{ color:var(--amber); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; }
  .status-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px; }
  .status-dot.on{ background:var(--sage); }
  .status-dot.off{ background:var(--danger); }
  .btn{ border:none; border-radius:999px; padding:13px 20px; font-family:'Inter', sans-serif; font-weight:600; font-size:14px; cursor:pointer; width:100%; margin-top:10px; }
  .btn-primary{ background:var(--sage); color:#FBF9F1; }
  .btn-danger{ background:var(--danger); color:#FBF1EE; }
  .sub{ font-size:13px; color:var(--text-muted); line-height:1.5; margin-top:6px; }
  .site-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .site-row:last-child{ border-bottom:none; }
</style>
</head>
<body>

<div class="brand">Limen<span>.</span></div>

<div class="card">
  <div><span id="vpn-status-dot" class="status-dot off"></span><b id="vpn-status-label">Bloqueo desactivado</b></div>
  <div class="sub">El bloqueo funciona a través de una VPN local en tu teléfono — el tráfico nunca sale de tu dispositivo, solo se filtra ahí mismo.</div>
  <button class="btn btn-primary" id="btn-toggle-vpn">Activar bloqueo</button>
</div>

<div class="card">
  <b>Sitios bloqueados</b>
  <div id="sites-list" class="sub">Cargando…</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
