<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Limen</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="brand">Limen<span>.</span></h1>
    </header>

    <main id="view-root">
      <!-- Onboarding del popup: 3 secciones estáticas, popup.js muestra una
           a la vez con showView(). El flujo del intento de desbloqueo/chat
           vive aparte, en blocked.html/blocked.js, con su propio patrón de
           renderizado dinámico. -->
      <section id="view-add-site" class="view">
        <p class="eyebrow" id="step-label"></p>
        <h2 class="title" id="add-site-title"></h2>
        <p class="sub" id="add-site-sub"></p>

        <div class="input-row">
          <input type="text" id="input-domain" placeholder="instagram.com" autocomplete="off">
          <button type="button" id="btn-add-site" class="btn-add">+</button>
        </div>
        <p class="field-error" id="domain-error" style="display:none;"></p>

        <div id="site-list" class="site-list"></div>

        <div class="confidential-note">
          <span class="ico">●</span>
          <span id="confidential-text"></span>
        </div>

        <button id="btn-continue" class="btn btn-primary" disabled></button>
      </section>

      <section id="view-schedule" class="view" style="display:none;">
        <p class="eyebrow" id="step2-label"></p>
        <h2 class="title" id="schedule-title"></h2>
        <p class="sub" id="schedule-sub"></p>

        <label class="field-label" id="days-hours-label"></label>
        <div class="day-toggle-row" id="day-toggles"></div>

        <div class="hour-row">
          <label class="hour-field">
            <span id="label-start"></span>
            <select id="select-start"></select>
          </label>
          <label class="hour-field">
            <span id="label-end"></span>
            <select id="select-end"></select>
          </label>
        </div>

        <label class="field-label" id="reason-why-label"></label>
        <textarea id="reason-why"></textarea>
        <p class="field-error" id="reason-why-error" style="display:none;"></p>

        <label class="field-label" id="reason-instead-label"></label>
        <textarea id="reason-instead"></textarea>

        <button id="btn-save-schedule" class="btn btn-primary"></button>
        <button id="btn-back-to-sites" class="btn-link"></button>
      </section>

      <section id="view-done" class="view" style="display:none;">
        <div class="center-block">
          <div class="big-emoji">🌿</div>
          <div class="title" id="done-title"></div>
          <div class="sub" id="done-sub"></div>
        </div>
        <button id="btn-edit-more" class="btn-link"></button>
      </section>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
