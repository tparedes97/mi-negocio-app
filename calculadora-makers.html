<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cuánto cobro? — Calculadora para makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --cream:#fdf0f5; --sage:#b98fd1; --sage-dark:#8a5fae; --clay:#e8628f;
    --brown:#3d1f36; --line:#f3d3de;
    --pink-50:#fdedf2; --pink-100:#fbdbe6; --pink-200:#f6c3d6;
    --plum-800:#4a2140; --gold:#eab766; --coral:#f2789a;

  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-font-smoothing:antialiased; }
  body{
    background:
      radial-gradient(circle at 12% 8%, #fbe0ea 0%, transparent 45%),
      radial-gradient(circle at 88% 6%, #e4d4f5 0%, transparent 40%),
      radial-gradient(circle at 90% 92%, #fbe0ea 0%, transparent 45%),
      linear-gradient(160deg, #fdf2f6 0%, #f6ecf9 100%);
    background-attachment:fixed;
    color:var(--brown); font-family:'Quicksand', sans-serif; font-weight:500;
    min-height:100vh; display:flex; justify-content:center; padding:28px 14px 60px;
  }
  .app{
    width:100%; max-width:460px; background:#fffbfc; border-radius:28px;
    padding:22px 18px 26px; box-shadow:0 24px 60px -24px rgba(107,44,84,0.35), 0 0 0 1px #fbe4ec;
    position:relative; overflow:hidden;
  }
  .app::before{
    content:""; position:absolute; top:-60px; right:-60px; width:160px; height:160px;
    background:radial-gradient(circle, #f6c9da 0%, transparent 70%); pointer-events:none;
  }
  header{ margin-bottom:18px; text-align:center; position:relative; }
  .lang-toggle{ display:flex; justify-content:center; align-items:center; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .lang-toggle button{ padding:6px 15px; border:1.5px solid var(--sage); border-radius:20px; background:#fff; color:var(--sage-dark); font-family:'Quicksand', sans-serif; font-size:11px; font-weight:700; letter-spacing:.03em; cursor:pointer; transition:transform .15s ease, background .15s ease; }
  .lang-toggle button:hover{ transform:translateY(-1px); }
  .lang-toggle button.active{ background:var(--sage); color:#fff; box-shadow:0 4px 12px -4px rgba(138,95,174,0.5); }
  .eyebrow{ font-family:'Caveat', cursive; font-size:20px; font-weight:700; letter-spacing:.01em; color:var(--clay); transform:rotate(-2deg); display:inline-block; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:700; font-style:italic; font-size:29px; margin-top:2px; line-height:1.15; text-wrap:balance; color:var(--brown); }
  .sub{ font-size:12.5px; color:#8a6b7c; margin-top:8px; font-weight:500; }

  .cat-tabs{ display:flex; gap:7px; margin-bottom:18px; }
  .cat-tabs button{ flex:1; padding:11px 4px; border:1.5px solid var(--line); border-radius:16px; background:#fff; font-family:'Quicksand',sans-serif; font-size:11.5px; font-weight:700; color:var(--brown); cursor:pointer; transition:all .15s ease; }
  .cat-tabs button.active{ background:linear-gradient(135deg, var(--clay), var(--coral)); color:#fff; border-color:transparent; box-shadow:var(--shadow-pink); }
  .tab-section{ display:none; }
  .tab-section.active{ display:block; }

  .ad-slot{ border:1.5px dashed var(--pink-200); border-radius:16px; padding:14px; text-align:center; font-family:'Quicksand',sans-serif; font-size:10.5px; font-weight:700; color:var(--clay); letter-spacing:.05em; text-transform:uppercase; margin:18px 0; background:var(--pink-50); }
  .card{ background:#fffdfd; border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:16px; box-shadow:0 12px 28px -20px rgba(107,44,84,0.25); }
  .card h2{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:19px; margin-bottom:10px; color:var(--brown); }
  .card .note{ font-size:11.5px; color:#8a6b7c; margin-bottom:12px; line-height:1.55; }

  label{ font-family:'Quicksand', sans-serif; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; color:#a97e91; display:block; margin-bottom:4px; }
  input, select{ width:100%; border:1.3px solid var(--line); border-radius:12px; padding:9px 11px; font-family:'Quicksand',sans-serif; font-weight:600; font-size:13px; background:#fffdfb; color:var(--brown); }
  input:focus, select:focus{ outline:2px solid var(--sage); outline-offset:1px; border-color:var(--sage); }

  .ing-row{ background:var(--pink-50); border:1px solid var(--line); border-radius:16px; padding:13px; margin-bottom:11px; position:relative; }
  .ing-row .remove{ position:absolute; top:8px; right:8px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--pink-200); border-radius:50%; color:var(--clay); font-size:12px; cursor:pointer; font-weight:700; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
  .row-cost{ font-family:'Quicksand', sans-serif; font-size:11.5px; color:var(--sage-dark); margin-top:6px; font-weight:700; font-variant-numeric:tabular-nums; }

  .add-btn{ width:100%; padding:12px; border:1.5px dashed var(--clay); border-radius:14px; background:var(--pink-50); color:var(--clay); font-family:'Quicksand',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; margin-top:4px; transition:background .15s ease; }
  .add-btn:hover{ background:var(--pink-100); }

  .summary{ background:linear-gradient(160deg, var(--plum-800), #6b2c54); color:var(--cream); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:0 16px 32px -18px rgba(74,33,64,0.55); }
  .summary .line{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; padding:5px 0; border-bottom:1px solid rgba(253,240,245,0.14); font-variant-numeric:tabular-nums; }
  .summary .line:last-child{ border-bottom:none; }
  .summary .final{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:23px; margin-top:10px; padding-top:12px; border-top:1.5px solid var(--gold); display:flex; justify-content:space-between; align-items:baseline; font-variant-numeric:tabular-nums; }
  .summary .final b{ color:var(--gold); }

  table.eq-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  table.eq-table th{ font-family:'Quicksand',sans-serif; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; text-align:left; padding:6px 4px; color:#a97e91; border-bottom:1.5px solid var(--line); }
  table.eq-table td{ padding:7px 4px; border-bottom:1px solid var(--line); font-weight:500; }
  table.eq-table tr:last-child td{ border-bottom:none; }

  .tip{ background:var(--pink-50); border:1px solid var(--pink-200); border-radius:14px; padding:11px 13px; margin-bottom:10px; font-size:11.5px; line-height:1.55; }
  .tip b{ display:block; margin-bottom:3px; color:var(--clay); font-size:12px; }

  .main-section{ display:none; }
  .main-section.active{ display:block; }

  .content-card{ background:#fffdfd; border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:0 12px 28px -20px rgba(107,44,84,0.25); }
  .content-card .kicker{ font-family:'Quicksand',sans-serif; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--sage-dark); }
  .content-card h3{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:18px; margin-top:6px; margin-bottom:9px; color:var(--brown); }
  .content-card p{ font-size:12.5px; line-height:1.6; color:#6b4f5e; margin-bottom:6px; }
  .content-card ul{ padding-left:18px; margin-bottom:6px; }
  .content-card li{ font-size:12.5px; line-height:1.6; color:#6b4f5e; margin-bottom:3px; }
  .safety-note{ background:#fdeae6; border:1px solid #f0b8a8; border-radius:12px; padding:10px 12px; font-size:11.5px; color:#8a3a24; line-height:1.5; margin-top:8px; }
  .safety-note b{ display:block; margin-bottom:2px; }
  .recipe-subtabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .recipe-subtabs button{ padding:7px 14px; border:1.3px solid var(--line); border-radius:20px; background:#fff; font-family:'Quicksand',sans-serif; font-size:11px; font-weight:700; cursor:pointer; color:var(--brown); }
  .recipe-subtabs button.active{ background:var(--sage); color:#fff; border-color:var(--sage); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app">

  <header>

    <div id="ia-container"></div>

  </div>

</div>

const UNIT_OPTIONS = [
  {v:'g', l:{es:'gramos', en:'grams'}}, {v:'kg', l:{es:'kilos', en:'kilograms'}},
  {v:'ml', l:{es:'ml', en:'ml'}}, {v:'l', l:{es:'litros', en:'liters'}},
  {v:'cup', l:{es:'tazas', en:'cups'}}, {v:'tbsp', l:{es:'cucharadas', en:'tbsp'}},
  {v:'tsp', l:{es:'cucharaditas', en:'tsp'}}, {v:'unidad', l:{es:'unidades', en:'units'}},
];

const T = {
  ingTitle:{es:"🧾 Insumos de tu receta", en:"🧾 Your recipe's ingredients"},
  ingNote:{es:'Elige el insumo para que la conversión sea exacta. Para unidades sueltas (moldes, envases, ganchos) usa "unidad".', en:'Pick the ingredient so the conversion is accurate. For loose units (molds, containers, findings) use "unit".'},
  addBtn:{es:"+ Agregar insumo", en:"+ Add ingredient"},

const RESIN_RATIOS = [
  {type:{es:"Resina para mesa (table top)", en:"Table top resin"}, ratio:"1:1 (volumen)"},
  {type:{es:"Resina para joyería/moldes", en:"Jewelry/casting resin"}, ratio:"2:1 (volumen)"},

  {type:{es:"Resina UV", en:"UV resin"}, ratio:{es:"No se mezcla — cura con luz UV", en:"No mixing — cures with UV light"}},

/* ---------- Estado por categoría ---------- */
const state = {};
['reposteria','velas','resina'].forEach(cat => { state[cat] = { rows: [], counter: 0 }; });
let activeCat = 'reposteria';

function ingredientOptionsHtml(cat, selected){
  return Object.entries(CATEGORY_INGREDIENTS[cat]).map(([key, ing]) =>
    `<option value="${key}" ${key===selected?'selected':''}>${ing.label[LANG]}</option>`
  ).join('');
}
function unitOptionsHtml(selected, restrictToWeight){
  const opts = restrictToWeight ? UNIT_OPTIONS.filter(u => !['cup','tbsp','tsp'].includes(u.v)) : UNIT_OPTIONS;
  return opts.map(u => `<option value="${u.v}" ${u.v===selected?'selected':''}>${u.l[LANG]}</option>`).join('');
}

function renderCalculator(cat){
  const container = document.getElementById('calc-container');
  const isRatioTable = cat === 'resina';
  container.innerHTML = `

      <h2 data-t="${isRatioTable ? 'eqTitleRatio' : 'eqTitleCup'}"></h2>

    </div>
    <div class="ad-slot" data-i18n="ad"></div>
    <div class="card">
      <h2 data-t="ingTitle"></h2>
      <div class="note" data-t="ingNote"></div>
      <div id="ingredients-list-${cat}"></div>
      <button class="add-btn" id="add-ingredient-${cat}" data-t="addBtn"></button>
    </div>
    <div class="ad-slot" data-i18n="ad"></div>
    <div class="card">
      <h2 data-t="othersTitle"></h2>
      <label id="labor-hours-label-${cat}"></label>
      <input type="number" id="labor-hours-${cat}" placeholder="Ej: 2" step="0.25" style="margin-bottom:10px;">
      <label id="labor-rate-label-${cat}"></label>
      <input type="number" id="labor-rate-${cat}" placeholder="Ej: 15" style="margin-bottom:10px;">
      <label id="packaging-label-${cat}"></label>
      <input type="number" id="packaging-${cat}" placeholder="Ej: 5" style="margin-bottom:10px;">
      <label id="equipment-label-${cat}"></label>
      <input type="number" id="equipment-${cat}" placeholder="Ej: 2" style="margin-bottom:10px;">
      <label id="overhead-label-${cat}"></label>
      <input type="number" id="overhead-${cat}" placeholder="Ej: 3" style="margin-bottom:10px;">
      <label data-t="servingsLabel"></label>
      <input type="number" id="servings-${cat}" placeholder="Ej: 8" style="margin-bottom:10px;">
      <label data-t="marginLabel"></label>
      <input type="number" id="margin-${cat}" placeholder="Ej: 40">
    </div>
    <div class="summary" id="summary-${cat}"></div>
  `;
  applyScopedTranslations(container);
  document.getElementById(`add-ingredient-${cat}`).addEventListener('click', () => addIngredientRow(cat));
  ['labor-hours','labor-rate','packaging','equipment','overhead','servings','margin'].forEach(f => {
    document.getElementById(`${f}-${cat}`).addEventListener('input', () => calculate(cat));
  });
  renderEqTable(cat);
  if(state[cat].rows.length === 0){
    addIngredientRow(cat);
    addIngredientRow(cat);
  } else {
    state[cat].rows.forEach(id => rebuildRowLabels(cat, document.getElementById(id)));
  }
  calculate(cat);
}

    const key = el.dataset.t;
    if(T[key]) el.textContent = T[key][LANG];
  });
  scope.querySelectorAll('[data-i18n="ad"]').forEach(el => el.textContent = GLOBAL_T.ad[LANG]);

  const laborRateEl = document.getElementById(`labor-rate-label-${cat}`);

  const packagingEl = document.getElementById(`packaging-label-${cat}`);

  const equipmentEl = document.getElementById(`equipment-label-${cat}`);

function toGrams(qty, unit, densityKey, cat){
  if(!qty || qty <= 0) return null;
  if(unit === 'g') return qty;
  if(unit === 'kg') return qty * 1000;
  if(unit === 'ml') return qty;
  if(unit === 'l') return qty * 1000;
  if(unit === 'unidad') return null;
  const ing = CATEGORY_INGREDIENTS[cat][densityKey];
  if(!ing || ing[unit] == null) return null;
  return qty * ing[unit];
}

function calculate(cat){
  let totalIngredients = 0;
  state[cat].rows.forEach(id => {
    const row = document.getElementById(id);
    if(!row) return;
    const type = row.querySelector('.ing-type').value;
    const useQty = parseFloat(row.querySelector('.use-qty').value);
    const useUnit = row.querySelector('.use-unit').value;
    const buyPrice = parseFloat(row.querySelector('.buy-price').value);
    const buyQty = parseFloat(row.querySelector('.buy-qty').value);
    const buyUnit = row.querySelector('.buy-unit').value;
    const costEl = document.getElementById('cost-'+id);

    let cost = 0;
    if(useUnit === 'unidad' && buyUnit === 'unidad' && useQty > 0 && buyQty > 0 && buyPrice > 0){
      cost = (buyPrice / buyQty) * useQty;
    } else {
      const useGrams = toGrams(useQty, useUnit, type, cat);
      const buyGrams = toGrams(buyQty, buyUnit, type, cat);
      if(useGrams && buyGrams && buyPrice > 0){
        cost = (buyPrice / buyGrams) * useGrams;
      }
    }
    totalIngredients += cost;
    const displayName = type === 'personalizado' ? (row.querySelector('.custom-name').value.trim() || '') : '';
    const prefix = displayName ? `${T.rowCostLine[LANG]}(${displayName}) ` : T.rowCostLine[LANG];
    costEl.textContent = cost > 0 ? `${prefix}${CURRENCY} ${cost.toFixed(2)}` : T.rowCostPending[LANG];
  });

  const g = f => parseFloat(document.getElementById(`${f}-${cat}`)?.value) || 0;
  const laborHours = g('labor-hours'), laborRate = g('labor-rate'), packaging = g('packaging');
  const equipment = g('equipment'), overhead = g('overhead');
  const servings = g('servings') || 1, margin = g('margin');

  const laborCost = laborHours * laborRate;
  const totalCost = totalIngredients + laborCost + packaging + equipment + overhead;
  const costPerServing = totalCost / servings;
  const priceWithMargin = costPerServing * (1 + margin/100);
  const totalPriceMargin = totalCost * (1 + margin/100);

  const summary = document.getElementById(`summary-${cat}`);
  if(!summary) return;
  summary.innerHTML = `
    <div class="line"><span>${T.sumIngredients[LANG]}</span><span>${CURRENCY} ${totalIngredients.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumLabor[LANG]} (${laborHours}h × ${CURRENCY}${laborRate})</span><span>${CURRENCY} ${laborCost.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumPackaging[LANG]}</span><span>${CURRENCY} ${packaging.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumEquipment[LANG]}</span><span>${CURRENCY} ${equipment.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumOverhead[LANG]}</span><span>${CURRENCY} ${overhead.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumTotalCost[LANG]}</span><span>${CURRENCY} ${totalCost.toFixed(2)}</span></div>
    <div class="line"><span>${T.sumCostPerServing[LANG]} (${servings})</span><span>${CURRENCY} ${costPerServing.toFixed(2)}</span></div>
    <div class="final"><span>${T.sumFinal[LANG]}</span><b>${CURRENCY} ${priceWithMargin.toFixed(2)}</b></div>
    <div class="line" style="margin-top:6px;"><span>${T.sumFinalTotal[LANG]}</span><span>${CURRENCY} ${totalPriceMargin.toFixed(2)}</span></div>
  `;
}

  if(activeSection === 'consejos') renderConsejos();
  if(activeSection === 'ia') renderIA();
}

/* Init */
document.querySelectorAll('[data-i18n]').forEach(el => {
  const key = el.dataset.i18n;
  if(GLOBAL_T[key]) el.textContent = GLOBAL_T[key][LANG];
});
renderCalculator(activeCat);
</script>
</body>
</html>
